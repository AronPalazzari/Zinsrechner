<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zinsrechner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container min-vh-100 d-flex flex-column justify-content-center py-4">

    <h1 class="text-center mb-4">Zinsrechner</h1>

    <div class="row g-4">

        <!-- Eingabe -->
        <div class="col-12 col-lg-5">
            <div class="card h-100">
                <div class="card-body">
                    <form th:action="@{/zins}" method="get" th:object="${zinsForm}">
                        <div class="mb-3">
                            <label for="anfangskapital" class="form-label">Anfangskapital</label>
                            <input type="number" step="any" class="form-control"
                                   th:classappend="${#fields.hasErrors('anfangskapital')} ? 'is-invalid'"
                                   id="anfangskapital" th:field="*{anfangskapital}">
                            <div class="invalid-feedback" th:errors="*{anfangskapital}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="laufzeit" class="form-label">Laufzeit</label>
                            <input type="number" class="form-control"
                                   th:classappend="${#fields.hasErrors('laufzeit')} ? 'is-invalid'"
                                   id="laufzeit" th:field="*{laufzeit}">
                            <div class="invalid-feedback" th:errors="*{laufzeit}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="zinssatz" class="form-label">Zinssatz (% p.a.)</label>
                            <input type="number" step="any" class="form-control"
                                   th:classappend="${#fields.hasErrors('zinssatz')} ? 'is-invalid'"
                                   id="zinssatz" th:field="*{zinssatz}">
                            <div class="invalid-feedback" th:errors="*{zinssatz}"></div>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input"
                                   id="tabelleAnzeigen" th:field="*{tabelleAnzeigen}">
                            <label class="form-check-label" for="tabelleAnzeigen">Tabelle anzeigen</label>
                        </div>

                        <button type="submit" class="btn btn-primary">Aktualisieren</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Ergebnis -->
        <div class="col-12 col-lg-7">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Ergebnis</h2>
                    <div th:if="${endkapital != null}">
                    <p>Bei einer Laufzeit von <span th:text="${zinsForm.laufzeit}"></span> Jahren
                        bei einem konstanten Zinssatz von <span th:text="${zinsForm.zinssatz}"></span> % p.a.
                        und einem Anfangskapital von
                        <span th:text="${#numbers.formatDecimal(zinsForm.anfangskapital, 1, 'POINT', 2, 'COMMA')}"></span> Euro,
                        beträgt das Endkapital
                        <span th:text="${#numbers.formatDecimal(endkapital, 1, 'POINT', 2, 'COMMA')}"></span> Euro.
                    </p>
                    <table class="table" th:if="${zinsForm.tabelleAnzeigen}">
                        <thead>
                        <tr>
                            <th>Jahr</th>
                            <th>Anfangskapital</th>
                            <th>Zinsen</th>
                            <th>Endkapital</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="z : ${zeilen}">
                            <td th:text="${z.jahr}"></td>
                            <td th:text="${#numbers.formatDecimal(z.anfangskapital, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="${#numbers.formatDecimal(z.zinsen, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="${#numbers.formatDecimal(z.endkapital, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
